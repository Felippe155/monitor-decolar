name: Monitor Decolar

on:
  schedule:
    - cron: "*/10 * * * *"     # a cada 10 minutos
  workflow_dispatch:
    inputs:
      testar_alerta:
        description: "Só enviar uma mensagem de teste"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: monitor-decolar
  cancel-in-progress: false

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Playwright
        run: pip install playwright

      - name: Checar preço
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_FONE: ${{ secrets.WHATSAPP_FONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
        run: |
          if [ "${{ inputs.testar_alerta }}" = "true" ]; then
            python monitor.py --testar-alerta
          else
            python monitor.py
          fi

      - name: Salvar histórico
        if: ${{ inputs.testar_alerta != true }}
        run: |
          git config user.name "monitor-decolar"
          git config user.email "monitor-decolar@users.noreply.github.com"
          git add estado.json historico_precos.csv 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "checagem de preço" && git push)
